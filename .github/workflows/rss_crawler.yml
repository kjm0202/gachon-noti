name: RSS Crawler

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: rss-crawler
  cancel-in-progress: false

jobs:
  rss-crawl:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TS_EXIT_NODE: galaxy-s10e

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify crawler
        run: npm test

      - name: Connect to Tailscale with GitHub OIDC
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:gachon-noti
          ping: ${{ env.TS_EXIT_NODE }}

      - name: Route traffic through the Tailscale exit node
        run: |
          direct_ip="$(curl -fsS --max-time 10 https://api.ipify.org)"
          sudo tailscale set --exit-node="$TS_EXIT_NODE"

          for attempt in $(seq 1 10); do
            exit_ip="$(curl -fsS --max-time 10 https://api.ipify.org || true)"
            if [ -n "$exit_ip" ] && [ "$exit_ip" != "$direct_ip" ]; then
              echo "Egress moved from the runner to $TS_EXIT_NODE (attempt $attempt)"
              exit 0
            fi
            sleep 3
          done

          tailscale status || true
          echo "::error::Traffic is not leaving through exit node $TS_EXIT_NODE. Check that it advertises an exit node, the route is approved, and the policy grants tag:gachon-noti access to autogroup:internet."
          exit 1

      - name: Run crawler script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: node index.js
